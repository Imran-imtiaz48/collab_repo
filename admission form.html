<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    form {
      max-width: 600px;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    .gender, .course {
      margin-top: 10px;
    }
    .gender input, .course input {
      margin-right: 5px;
    }
    .button-group {
      margin-top: 20px;
    }
    img {
      display: block;
      margin: 20px auto;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Admission Form 2023</h1>
  <hr>

  <form>
    <label for="fullname">Full Name:</label>
    <input type="text" name="fullname" id="fullname">

    <label for="fathername">Father's Name:</label>
    <input type="text" name="fathername" id="fathername">

    <label for="mothername">Mother's Name:</label>
    <input type="text" name="mothername" id="mothername">

    <label for="address">Address:</label>
    <textarea rows="5" cols="30" name="address" id="address"></textarea>

    <label for="email">Email:</label>
    <input type="text" name="email" id="email">

    <label for="mobile">Mobile Number:</label>
    <input type="text" name="mobile" id="mobile">

    <div class="gender">
      <label>Gender:</label>
      <input type="radio" name="gender" id="male">
      <label for="male">Male</label>
      <input type="radio" name="gender" id="female">
      <label for="female">Female</label>
    </div>

    <div class="course">
      <label>Course:</label>
      <input type="checkbox" name="course" id="web">
      <label for="web">Web</label><br>
      <input type="checkbox" name="course" id="network">
      <label for="network">Network</label><br>
      <input type="checkbox" name="course" id="hardware">
      <label for="hardware">Hardware</label>
    </div>

    <img src="Our School Beautinessic.jpg" alt="School Image">

    <div class="button-group">
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </div>
  </form>

</body>
</html>
